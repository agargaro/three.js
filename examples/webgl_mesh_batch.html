<!DOCTYPE html>
<html lang="en">
<head>
	<title>three.js webgl - mesh - batch</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		#info {
			background-color: rgba(0,0,0,0.75);
		}
	</style>
</head>
<body>

	<div id="info">

		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - mesh - batch

	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.module.js",
				"three/addons/": "./jsm/",

				"@three.ez/batched-mesh-extensions": "https://cdn.jsdelivr.net/npm/@three.ez/batched-mesh-extensions@0.0.8/build/webgl.js",
				"bvh.js": "https://cdn.jsdelivr.net/npm/bvh.js@0.0.13/build/index.js"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';

		import Stats from 'three/addons/libs/stats.module.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { createRadixSort, extendBatchedMeshPrototype } from '@three.ez/batched-mesh-extensions';

		// add and override BatchedMesh methods ( @three.ez/batched-mesh-extensions )
		extendBatchedMeshPrototype();

		let stats, gui, guiStatsEl;
		let camera, controls, scene, renderer;
		let geometries, mesh, material;
		const ids = [];
		const matrix = new THREE.Matrix4();
		let sortFunction;
		const white = new THREE.Color();
		const red = new THREE.Color();

		//

		const position = new THREE.Vector3();
		const rotation = new THREE.Euler();
		const quaternion = new THREE.Quaternion();
		const scale = new THREE.Vector3();

		//

		const MAX_GEOMETRY_COUNT = 500000;

		const Method = {
			BATCHED: 'BATCHED',
			NAIVE: 'NAIVE'
		};

		const api = {
			method: Method.BATCHED,
			count: 700000,
			dynamic: 100,

			sortObjects: true,
			perObjectFrustumCulled: true,
			opacity: 1,
			useCustomSort: true,

			partialUpdate: false
		};

		init();
		initGeometries();
		initMesh();

		//

		function randomizeMatrix( matrix ) {

			position.x = Math.random() * 1000 - 500;
			position.y = Math.random() * 1000 - 500;
			position.z = Math.random() * 1000 - 500;

			rotation.x = Math.random() * 2 * Math.PI;
			rotation.y = Math.random() * 2 * Math.PI;
			rotation.z = Math.random() * 2 * Math.PI;

			quaternion.setFromEuler( rotation );

			scale.x = scale.y = scale.z = 0.5 + ( Math.random() * 0.5 );

			return matrix.compose( position, quaternion, scale );

		}

		function randomizeRotationSpeed( rotation ) {

			rotation.x = Math.random() * 0.01;
			rotation.y = Math.random() * 0.01;
			rotation.z = Math.random() * 0.01;
			return rotation;

		}

		function initGeometries() {

			geometries = [
				new THREE.ConeGeometry( 1.0, 2.0 ),
				new THREE.BoxGeometry( 2.0, 2.0, 2.0 ),
				new THREE.SphereGeometry( 1.0, 16, 8 ),
			];

		}

		function createMaterial() {

			if ( ! material ) {

				material = new THREE.MeshLambertMaterial();

			}

			return material;

		}

		function cleanup() {

			if ( mesh ) {

				mesh.parent.remove( mesh );

				if ( mesh.dispose ) {

					mesh.dispose();

				}

			}

		}

		function initMesh() {

			cleanup();

			if ( api.method === Method.BATCHED ) {

				initBatchedMesh();

			} else {

				initRegularMesh();

			}

		}

		function initRegularMesh() {

			mesh = new THREE.Group();
			const material = createMaterial();

			for ( let i = 0; i < api.count; i ++ ) {

				const child = new THREE.Mesh( geometries[ i % geometries.length ], material );
				randomizeMatrix( child.matrix );
				child.matrix.decompose( child.position, child.quaternion, child.scale );
				child.userData.rotationSpeed = randomizeRotationSpeed( new THREE.Euler() );
				mesh.add( child );

			}

			scene.add( mesh );

		}

		function initBatchedMesh() {

			mesh && mesh.dispose( THREE.WebGLCoordinateSystem );

			const geometryCount = api.count;
			const vertexCount = geometries.length * 512;
			const indexCount = geometries.length * 1024;

			const euler = new THREE.Euler();
			const matrix = new THREE.Matrix4();
			mesh = new THREE.BatchedMesh( geometryCount, vertexCount, indexCount, createMaterial() );
			mesh.userData.rotationSpeeds = [];

			// disable full-object frustum culling since all of the objects can be dynamic.
			mesh.frustumCulled = false;

			ids.length = 0;

			const geometryIds = [
				mesh.addGeometry( geometries[ 0 ] ),
				mesh.addGeometry( geometries[ 1 ] ),
				mesh.addGeometry( geometries[ 2 ] ),
			];

			for ( let i = 0; i < api.count; i ++ ) {

				const id = mesh.addInstance( geometryIds[ i % geometryIds.length ] );
				mesh.setMatrixAt( id, randomizeMatrix( matrix ) );
				mesh.setColorAt( id, red );

				const rotationMatrix = new THREE.Matrix4();
				rotationMatrix.makeRotationFromEuler( randomizeRotationSpeed( euler ) );
				mesh.userData.rotationSpeeds.push( rotationMatrix );

				ids.push( id );

			}

			// compute tlas (top-level acceleration structure) bvh ( @three.ez/batched-mesh-extensions )
			mesh.computeBVH( THREE.WebGLCoordinateSystem );

			sortFunction = createRadixSort( mesh );

			scene.add( mesh );

		}

		function init() {

			const width = window.innerWidth;
			const height = window.innerHeight;

			// camera

			camera = new THREE.PerspectiveCamera( 70, width / height, 1, 100 );
			camera.position.z = 30;

			// renderer

			renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( width, height );
			renderer.setAnimationLoop( animate );
			document.body.appendChild( renderer.domElement );

			// scene

			scene = new THREE.Scene();
			scene.background = new THREE.Color( 0xffffff );

			// lights

			scene.add( new THREE.AmbientLight(), new THREE.DirectionalLight() );

			// controls

			controls = new OrbitControls( camera, renderer.domElement );
			controls.autoRotate = true;
			controls.autoRotateSpeed = 1.0;

			// stats

			stats = new Stats();
			document.body.appendChild( stats.dom );

			// gui

			gui = new GUI();
			gui.add( api, 'count', 1, MAX_GEOMETRY_COUNT ).step( 1 ).onChange( initMesh ).disable();
			gui.add( api, 'dynamic', 0, MAX_GEOMETRY_COUNT ).step( 1 );
			gui.add( api, 'method', Method ).onChange( initMesh );
			gui.add( api, 'opacity', 0, 1 ).onChange( v => {

				if ( v < 1 ) {

					material.transparent = true;
					material.depthWrite = false;

				} else {

					material.transparent = false;
					material.depthWrite = true;

				}

				material.opacity = v;
				material.needsUpdate = true;

			} );
			gui.add( api, 'sortObjects' );
			gui.add( api, 'perObjectFrustumCulled' );
			gui.add( api, 'useCustomSort' );
			gui.add( api, 'partialUpdate' );

			guiStatsEl = document.createElement( 'li' );
			guiStatsEl.classList.add( 'gui-stats' );

			// listeners

			window.addEventListener( 'resize', onWindowResize );

		}

		function onWindowResize() {

			const width = window.innerWidth;
			const height = window.innerHeight;

			camera.aspect = width / height;
			camera.updateProjectionMatrix();

			renderer.setSize( width, height );

		}

		function animate() {

			animateMeshes();

			// TODO here the onBeforeRender function is overriden by my library, so we are not testing the partial update of the indirect texture

			controls.update();
			stats.update();

			render();

		}

		function animateMeshes() {

			const loopNum = Math.min( api.count, api.dynamic );

			if ( api.method === Method.BATCHED ) {

				for ( let i = 0; i < loopNum; i ++ ) {

					const rotationMatrix = mesh.userData.rotationSpeeds[ i ];
					const id = ids[ i ];

					mesh.getMatrixAt( id, matrix );
					matrix.multiply( rotationMatrix );
					mesh.setMatrixAt( id, matrix );
					mesh.setColorAt( id, white );

				}

				if ( api.partialUpdate ) {

					// TODO: fix update bug if partialUpdate is true on start, it should update the entire texture anyway
					mesh._matricesTexture.addUpdateRange( 0, api.dynamic * 4 ); // * 4 because we need 4 pixels for matrix
					mesh._colorsTexture.addUpdateRange( 0, api.dynamic );
		
				}

			} else {

				for ( let i = 0; i < loopNum; i ++ ) {

					const child = mesh.children[ i ];
					const rotationSpeed = child.userData.rotationSpeed;

					child.rotation.set(
						child.rotation.x + rotationSpeed.x,
						child.rotation.y + rotationSpeed.y,
						child.rotation.z + rotationSpeed.z
					);

				}

			}

		}

		function render() {

			if ( mesh.isBatchedMesh ) {

				mesh.sortObjects = api.sortObjects;
				mesh.perObjectFrustumCulled = api.perObjectFrustumCulled;
				mesh.setCustomSort( api.useCustomSort ? sortFunction : null );

			}

			renderer.render( scene, camera );

		}

	</script>

</body>
</html>
